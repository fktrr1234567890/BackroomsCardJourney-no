plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.backrooms.cardjourney'
    compileSdk 34

    defaultConfig {
        applicationId "com.backrooms.cardjourney"
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName "0.0.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    // CI 里 lint 只产出报告不阻断构建，避免历史告警直接把流水线打红
    lint {
        abortOnError false
        checkReleaseBuilds true
    }
}

dependencies {
    // GameEngine 是纯 Kotlin，可以直接用 JVM 单元测试覆盖核心规则
    testImplementation 'junit:junit:4.13.2'
}
